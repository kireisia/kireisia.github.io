<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移転しました｜株式会社キレイシア</title>
  <!-- 旧アドレスに来た方を、新しい公式サイトへ自動で案内するためのページ。
       LPの内容は表示しない（同じ会社のサイトが2つある状態を避けるため）。 -->
  <!-- 検索エンジンに「正式なURLは新サイト」と伝える -->
  <link rel="canonical" href="https://www.kireisia.co.jp/service.html">
  <!-- 旧アドレス自体は検索結果に出さない -->
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://www.kireisia.co.jp/service.html">

  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: #FAFCFE; color: #2D3748;
      text-align: center; padding: 24px; line-height: 1.8;
    }
    .box { max-width: 520px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { font-size: .95rem; color: #5A6677; margin: 0 0 20px; }
    a {
      display: inline-block; background: #5BBEE5; color: #fff;
      text-decoration: none; font-weight: 700;
      padding: 14px 28px; border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ホームページは移転しました</h1>
    <p>自動で新しいページへ移動します。<br>切り替わらない場合は下のボタンをタップしてください。</p>
    <a href="https://www.kireisia.co.jp/service.html" id="newSiteLink">新しいホームページを開く</a>
  </div>
  <script>
    // サービス一覧ページへ移動する（戻るボタンで戻らないよう置き換える）
    // ※LINE公式リッチメニューのキャッシュ対策。トップに戻す場合は下のURLを "/" に変更
    location.replace("https://www.kireisia.co.jp/service.html");
  </script>
</body>
</html>
