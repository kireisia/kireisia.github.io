# Pages CMS 設定ファイル
# https://pagescms.org/docs/configuration

# メディア（画像）の設定
media:
  input: images
  output: images

# コンテンツ編集可能項目
content:
  # 基本情報（電話番号・住所など）
  - name: settings
    label: 基本情報
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: phone
        label: 電話番号
        type: string
      - name: address
        label: 住所
        type: text
      - name: business_hours
        label: 営業時間
        type: string

  # ヒーローセクション（トップ画面）
  - name: hero
    label: ヒーロー（トップ画面）
    type: file
    path: content/hero.json
    format: json
    fields:
      - name: status_badge
        label: ステータスバッジ（上部の緑丸アイコン横）
        type: string
      - name: catchphrase
        label: メインキャッチコピー
        type: object
        fields:
          - name: part1
            label: 強調1（青色）
            type: string
          - name: part2
            label: 中間1
            type: string
          - name: part3
            label: 強調2（青色）
            type: string
          - name: part4
            label: 中間2
            type: string
          - name: part5
            label: 末尾（青下線付き）
            type: string
      - name: area_label_line1
        label: 拠点テキスト 1行目
        type: string
      - name: area_label_line2
        label: 拠点テキスト 2行目
        type: string
      - name: achievement_1
        label: 実績バッジ 1（青色）
        type: object
        fields:
          - name: number
            label: 数字
            type: string
          - name: unit
            label: 単位
            type: string
          - name: label
            label: 説明
            type: text
      - name: achievement_2
        label: 実績バッジ 2（青色）
        type: object
        fields:
          - name: number
            label: 数字
            type: string
          - name: unit
            label: 単位
            type: string
          - name: label
            label: 説明
            type: text
      - name: achievement_3
        label: 実績バッジ 3（オレンジ色・★付き）
        type: object
        fields:
          - name: number
            label: 数字
            type: string
          - name: label
            label: 説明
            type: text
      - name: achievement_4
        label: 実績バッジ 4（オレンジ色）
        type: object
        fields:
          - name: number
            label: 数字
            type: string
          - name: unit
            label: 単位
            type: string
          - name: label
            label: 説明
            type: text
      - name: subtitle
        label: サブタイトル（実績バッジの下の説明文）
        type: text
      - name: discount
        label: 割引バッジ
        type: object
        fields:
          - name: text_before
            label: 文言（前）
            type: string
          - name: price
            label: 割引額
            type: string
          - name: text_after
            label: 文言（後）
            type: string
          - name: notes
            label: 注記
            type: string

  # サービスカード（12枚）
  - name: services
    label: サービスカード一覧（12種）
    type: file
    path: content/services.json
    format: json
    fields:
      - name: aircon
        label: エアコンクリーニング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: washer
        label: 洗濯機クリーニング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: water
        label: 水回りクリーニング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: sofa
        label: ソファクリーニング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: mattress
        label: マットレスクリーニング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: wall
        label: 壁紙再生コーティング
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: vacant
        label: 空室清掃
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: aircon_install
        label: エアコン設置
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: shop
        label: 店舗清掃
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: handyman
        label: 便利屋
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: drain
        label: 排水管洗浄
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}
      - name: housekeeping
        label: 家事代行
        type: object
        fields:
          - {name: image, label: カード画像, type: image}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明文, type: text}
          - {name: price, label: 価格表示, type: string}

  # キャンペーン告知（サービス直下に表示）
  - name: campaign
    label: キャンペーン告知
    type: file
    path: content/campaign.json
    format: json
    fields:
      - name: enabled
        label: 表示する（ONにするとサイトに表示されます）
        type: boolean
        default: false
      - name: badge
        label: バッジ文言
        type: string
        default: "キャンペーン実施中"
      - name: title
        label: タイトル
        type: string
        default: "期間限定キャンペーンのお知らせ"
      - name: body
        label: 本文
        type: text
      - name: period
        label: 期間
        type: string
        default: "期間：未定"
