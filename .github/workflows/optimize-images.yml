# =================================================
# 画像自動圧縮ワークフロー
# =================================================
# Pages CMSや手動pushで画像が追加・更新されると自動で圧縮します。
# 圧縮済画像を自動コミット&pushして本番に反映します。
#
# 対応形式：jpg / jpeg / png
# 処理内容：
#   - JPEG: quality 80、プログレッシブ化
#   - PNG : quality 80
#   - 大きすぎる画像は最大1500pxにリサイズ（imagemin系で自動）
# =================================================

name: 画像自動圧縮

on:
  push:
    branches: [main]
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
  workflow_dispatch:  # GitHub UI から手動実行も可能

jobs:
  optimize:
    # 自分自身がpushしたコミット([skip ci]含む)は処理しない（無限ループ防止）
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリチェックアウト
        uses: actions/checkout@v4

      - name: 画像圧縮実行
        uses: calibreapp/image-actions@main
        id: calibre
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          jpegQuality: '80'
          jpegProgressive: true
          pngQuality: '80'

      - name: 圧縮版を自動コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🖼️ 画像自動圧縮 [skip ci]"
            git push
          else
            echo "圧縮による変更なし"
          fi
